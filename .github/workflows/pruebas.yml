name: Pruebas
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e . -c constraints.txt pytest
      - run: pytest -q tests/test_core.py
      # Los self-checks asíncronos (_test_borrador, _test_estado…) solo corren así.
      - run: python tests/test_core.py
